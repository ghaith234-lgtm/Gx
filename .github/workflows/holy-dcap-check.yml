# ⚡ Holy DCA+ check on REAL OKX prices (v3.36.56): the normal sell DCA against DCA+ (the layered exit — 0.5% with and without re-open ·
#    1%) on the last three real months of seven coins (5-minute candles · the trial path's own fetch) · the real engines on the
#    dashboard's paper exchange. Results: lines HOLYDCAP. Public market data only — no keys, no orders, no notifications.
name: Holy DCA+ real-prices check
on:
  push:
    branches: [claude/eager-brown-jf08ur]
    paths: ['ci/dcap_real_check.py', 'ci/RUN_DCAP', '.github/workflows/holy-dcap-check.yml']
permissions:
  contents: read
jobs:
  dcap-real:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: DCA vs DCA+ on real OKX prices (public data · no keys · no orders · no notifications)
        run: |
          pip install -q requests
          python3 ci/dcap_real_check.py Holy_Dashboard.pyw
