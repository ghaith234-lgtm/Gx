name: Holy signals check 17
on:
  push:
    branches: [claude/eager-brown-jf08ur]
    paths: ['ci/sig_check17.py', 'ci/RUN_SIG17', '.github/workflows/holy-sig17-check.yml']
permissions:
  contents: read
jobs:
  newdata:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the new data inside the groups (the dashboard's own fetchers and gp_walk on 1H, 4H and 1D, each new member vs its usual, the groups with and without them, shuffled prices) — public data, no keys, no orders, no notifications
        run: |
          pip install -q requests numpy
          python3 ci/sig_check17.py Holy_Dashboard.pyw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holysig17
          path: /tmp/holysig17.json
          if-no-files-found: ignore
