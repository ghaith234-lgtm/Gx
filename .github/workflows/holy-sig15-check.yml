name: Holy signals check 15
on:
  push:
    branches: [claude/eager-brown-jf08ur]
    paths: ['ci/sig_check15.py', 'ci/RUN_SIG15', '.github/workflows/holy-sig15-check.yml']
permissions:
  contents: read
jobs:
  tendency-and-range:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the daily tendency (the dashboard's own td_walk, variants picked on the past and judged on the last two years) and the range estimators, on real OKX prices vs shuffled (public data · no keys · no orders · no notifications)
        run: |
          pip install -q requests numpy
          python3 ci/sig_check15.py Holy_Dashboard.pyw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holysig15
          path: /tmp/holysig15.json
          if-no-files-found: ignore
