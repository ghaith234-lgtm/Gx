# 🔬 Holy signals check, fourth pass (the owner 13-11: stronger indicators): a 🔺 top score · 🌤️ «grid weather» (does a choppy market stay
#    choppy?) · 💥 a 4-hour crash with huge volume · 🟢 the bottom with / without a volume blow-off — on public OKX candles for 28 coins,
#    every past candle seeing only what came before it · the last 40% of time apart. Results: lines HOLYSIG4.
# Public market data only — no keys, no orders, no notifications. Runs only when the check, ci/RUN_SIG or this file changes.
name: Holy signals check 4
on:
  push:
    branches: [claude/eager-brown-jf08ur]
    paths: ['ci/sig_check4.py', 'ci/RUN_SIG4', '.github/workflows/holy-sig4-check.yml']
permissions:
  contents: read
jobs:
  real-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Signals on real OKX prices (public data · no keys · no orders · no notifications)
        run: |
          pip install -q requests
          python3 ci/sig_check4.py Holy_Dashboard.pyw
