# 🔎 Holy v3.33.0 source probe: checks the public sources planned for the new indicators from a GitHub runner
#    (OKX trading data · Deribit DVOL · CoinMetrics MVRV · economic calendar · FRED · GPR · GDELT). Results: lines HOLYP in the job log.
# Public GETs only — no keys, no orders, no notifications. Runs only when the probe or this file changes.
name: Holy sources x33 probe
on:
  push:
    branches: [claude/eager-brown-jf08ur]
    paths: ['ci/x33_probe.py', '.github/workflows/holy-x33-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public sources
        run: |
          pip install -q requests
          python3 ci/x33_probe.py
