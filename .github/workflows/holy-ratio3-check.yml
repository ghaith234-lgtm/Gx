name: Holy ratio check 3
on:
  push:
    branches: [claude/eager-brown-jf08ur]
    paths: ['ci/ratio_check3.py', 'ci/RUN_RATIO3', '.github/workflows/holy-ratio3-check.yml']
permissions:
  contents: read
jobs:
  ratio3:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: XRP main coin and XLM second (♾️ on the XLM price counted in XRP · the dollar only in between · 0.1% every order · starts · profit choices · steps · orders · floors · profit per day · months · rolling starts · real OKX candles 1H 3 years · 15m 1 year · 5m 90 days) — public data, no keys, no orders
        run: |
          pip install -q requests numpy
          python3 ci/ratio_check3.py Holy_Dashboard.pyw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holyratio3
          path: /tmp/holyratio3.json
          if-no-files-found: ignore
