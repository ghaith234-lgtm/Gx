name: Holy ratio check 4
on:
  push:
    branches: [claude/eager-brown-jf08ur]
    paths: ['ci/ratio_check4.py', 'ci/RUN_RATIO4', '.github/workflows/holy-ratio4-check.yml']
permissions:
  contents: read
jobs:
  ratio4:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: «شبكة عملتين» before it is built — XRP main with SOL · XLM · LINK · BTC · ETH (one bot per coin · 2% · amounts in XRP like ♾️ in dollars · all profit to XRP · every fee · direct pairs on OKX · profit per day · real OKX candles 1H 3 years · 15m 1 year · 5m 90 days) — public data, no keys, no orders
        run: |
          pip install -q requests numpy
          python3 ci/ratio_check4.py Holy_Dashboard.pyw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holyratio4
          path: /tmp/holyratio4.json
          if-no-files-found: ignore
