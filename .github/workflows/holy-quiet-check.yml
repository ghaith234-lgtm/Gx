# 😴 Holy quiet-market check (the owner 10-11: «اغلب الاوقات السوق ميت»): the real 🪜 engine on 90 real days of XRP, profit by kind of day · lines HOLYQUIET.
# Public market data only — no keys, no orders, no notifications. Runs only when the check, ci/RUN_QUIET or this file changes.
name: Holy quiet-market check
on:
  push:
    branches: [claude/eager-brown-jf08ur]
    paths: ['ci/quiet_check.py', 'ci/RUN_QUIET', '.github/workflows/holy-quiet-check.yml']
permissions:
  contents: read
jobs:
  real-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Funding arbitrage vs grid on real OKX data (public data · no keys · no orders · no notifications)
        run: |
          pip install -q requests
          python3 ci/quiet_check.py Holy_Dashboard.pyw
