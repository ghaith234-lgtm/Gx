# 📈 Holy trial-path check on REAL OKX prices (v3.36.29): every period's real candles (counts · gaps · paging back) · the same real week
#    on 1m / 5m / 15m / 30m / 1H candles (what coarser candles miss) · two real trials end to end through the dashboard (bt_start → its
#    background fetch → the sealed worker → bt_status). Results: lines HOLYBT.
# Public market data only — no keys, no orders, no notifications. Runs only when the check, ci/RUN_BT or this file changes.
name: Holy trial-path real-prices check
on:
  push:
    branches: [claude/eager-brown-jf08ur]
    paths: ['ci/bt_real_check.py', 'ci/RUN_BT', '.github/workflows/holy-bt-check.yml']
permissions:
  contents: read
jobs:
  real-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The trial path on real OKX prices (public data · no keys · no orders · no notifications)
        run: |
          pip install -q requests
          python3 ci/bt_real_check.py Holy_Dashboard.pyw
